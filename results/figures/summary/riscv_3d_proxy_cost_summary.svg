<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 36px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 19px; fill: #374151; }
      .panel-title { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .axis { stroke: #111827; stroke-width: 2; }
      .grid { stroke: #d1d5db; stroke-width: 1.2; }
      .tick { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #111827; }
      .axis-label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #111827; font-weight: 600; }
      .legend { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #111827; }
      .value { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #111827; font-weight: 600; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #4b5563; }
      .caption { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #374151; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #4b5563; }
      .generic { fill: #7a7a7a; }
      .connectivity { fill: #4c78a8; }
      .v2 { fill: #59a14f; }
      .v3 { fill: #f28e2b; }
      .panel-bg { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.4; rx: 10; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="980" fill="#ffffff"/>

  <text x="900" y="56" text-anchor="middle" class="title">RISC-V-Aware 3D Proxy Cost Evaluation</text>
  <text x="900" y="88" text-anchor="middle" class="subtitle">Architecture semantics and graph-context confidence reduce weighted inter-tier communication cost on two RISC-V designs</text>

  <!-- Legend -->
  <rect x="468" y="118" width="22" height="22" class="generic"/>
  <text x="500" y="136" class="legend">Generic balance</text>
  <rect x="666" y="118" width="22" height="22" class="connectivity"/>
  <text x="698" y="136" class="legend">Connectivity-only</text>
  <rect x="890" y="118" width="22" height="22" class="v2"/>
  <text x="922" y="136" class="legend">ASA-RV3D v2</text>
  <rect x="1088" y="118" width="22" height="22" class="v3"/>
  <text x="1120" y="136" class="legend">ASA-RV3D v3 context</text>

  <!-- Panel A background -->
  <rect x="70" y="170" width="805" height="650" class="panel-bg"/>
  <text x="105" y="215" class="panel-title">A. Normalized RISC-V-aware 3D proxy cost</text>
  <text x="105" y="244" class="small">Lower is better. Cost is normalized by total net connections.</text>

  <!-- Panel A chart coords: x0=150 y0=730 chartW=660 chartH=430 ymax=2.5 -->
  <!-- Grid lines y=0,0.5,1.0,1.5,2.0,2.5 -->
  <line x1="150" y1="730" x2="810" y2="730" class="axis"/>
  <line x1="150" y1="644" x2="810" y2="644" class="grid"/>
  <line x1="150" y1="558" x2="810" y2="558" class="grid"/>
  <line x1="150" y1="472" x2="810" y2="472" class="grid"/>
  <line x1="150" y1="386" x2="810" y2="386" class="grid"/>
  <line x1="150" y1="300" x2="810" y2="300" class="grid"/>
  <line x1="150" y1="300" x2="150" y2="730" class="axis"/>

  <text x="135" y="736" text-anchor="end" class="tick">0.0</text>
  <text x="135" y="650" text-anchor="end" class="tick">0.5</text>
  <text x="135" y="564" text-anchor="end" class="tick">1.0</text>
  <text x="135" y="478" text-anchor="end" class="tick">1.5</text>
  <text x="135" y="392" text-anchor="end" class="tick">2.0</text>
  <text x="135" y="306" text-anchor="end" class="tick">2.5</text>
  <text x="94" y="515" transform="rotate(-90 94 515)" text-anchor="middle" class="axis-label">Normalized proxy cost</text>

  <!-- Panel A Ibex bars group center 330, bar width 42, gap 10; scale 172 px per cost -->
  <rect x="236" y="344.7" width="42" height="385.3" class="generic"/>
  <rect x="288" y="457.8" width="42" height="272.2" class="connectivity"/>
  <rect x="340" y="558.2" width="42" height="171.8" class="v2"/>
  <rect x="392" y="581.3" width="42" height="148.7" class="v3"/>
  <text x="257" y="334" text-anchor="middle" class="value">2.24</text>
  <text x="309" y="448" text-anchor="middle" class="value">1.58</text>
  <text x="361" y="548" text-anchor="middle" class="value">1.00</text>
  <text x="413" y="571" text-anchor="middle" class="value">0.86</text>
  <text x="335" y="770" text-anchor="middle" class="axis-label">Ibex</text>

  <!-- Panel A riscv32i bars group center 630 -->
  <rect x="536" y="387.1" width="42" height="342.9" class="generic"/>
  <rect x="588" y="590.9" width="42" height="139.1" class="connectivity"/>
  <rect x="640" y="628.2" width="42" height="101.8" class="v2"/>
  <rect x="692" y="633.9" width="42" height="96.1" class="v3"/>
  <text x="557" y="377" text-anchor="middle" class="value">1.99</text>
  <text x="609" y="581" text-anchor="middle" class="value">0.81</text>
  <text x="661" y="618" text-anchor="middle" class="value">0.59</text>
  <text x="713" y="624" text-anchor="middle" class="value">0.56</text>
  <text x="635" y="770" text-anchor="middle" class="axis-label">riscv32i</text>

  <!-- Panel B background -->
  <rect x="925" y="170" width="805" height="650" class="panel-bg"/>
  <text x="960" y="215" class="panel-title">B. Reduction vs. generic balance</text>
  <text x="960" y="244" class="small">Higher is better. Generic balance is the zero-reference baseline.</text>

  <!-- Panel B chart coords: x0=1005 y0=730 chartW=660 chartH=430 ymax=80 -->
  <line x1="1005" y1="730" x2="1665" y2="730" class="axis"/>
  <line x1="1005" y1="622.5" x2="1665" y2="622.5" class="grid"/>
  <line x1="1005" y1="515" x2="1665" y2="515" class="grid"/>
  <line x1="1005" y1="407.5" x2="1665" y2="407.5" class="grid"/>
  <line x1="1005" y1="300" x2="1665" y2="300" class="grid"/>
  <line x1="1005" y1="300" x2="1005" y2="730" class="axis"/>

  <text x="990" y="736" text-anchor="end" class="tick">0%</text>
  <text x="990" y="628" text-anchor="end" class="tick">20%</text>
  <text x="990" y="521" text-anchor="end" class="tick">40%</text>
  <text x="990" y="413" text-anchor="end" class="tick">60%</text>
  <text x="990" y="306" text-anchor="end" class="tick">80%</text>
  <text x="948" y="515" transform="rotate(-90 948 515)" text-anchor="middle" class="axis-label">Reduction in 3D proxy cost</text>

  <!-- Panel B Ibex bars: connectivity 29.4, v2 55.5, v3 61.5; scale 5.375 px/% -->
  <rect x="1094" y="571.8" width="50" height="158.2" class="connectivity"/>
  <rect x="1157" y="431.8" width="50" height="298.2" class="v2"/>
  <rect x="1220" y="399.7" width="50" height="330.3" class="v3"/>
  <text x="1119" y="561" text-anchor="middle" class="value">29.4%</text>
  <text x="1182" y="421" text-anchor="middle" class="value">55.5%</text>
  <text x="1245" y="389" text-anchor="middle" class="value">61.5%</text>
  <text x="1182" y="770" text-anchor="middle" class="axis-label">Ibex</text>

  <!-- Panel B riscv32i bars: connectivity 59.4, v2 70.3, v3 72.0 -->
  <rect x="1394" y="410.6" width="50" height="319.4" class="connectivity"/>
  <rect x="1457" y="352.1" width="50" height="377.9" class="v2"/>
  <rect x="1520" y="343.1" width="50" height="386.9" class="v3"/>
  <text x="1419" y="400" text-anchor="middle" class="value">59.4%</text>
  <text x="1482" y="342" text-anchor="middle" class="value">70.3%</text>
  <text x="1545" y="333" text-anchor="middle" class="value">72.0%</text>
  <text x="1482" y="770" text-anchor="middle" class="axis-label">riscv32i</text>

  <!-- Callout -->
  <rect x="365" y="842" width="1070" height="70" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10"/>
  <text x="900" y="872" text-anchor="middle" class="caption">Key observation: graph-context v3 gives the lowest architecture-weighted 3D proxy cost on both designs.</text>
  <text x="900" y="897" text-anchor="middle" class="note">Metric includes base crossing, high-fanout penalty, control/datapath boundary cost, architecture criticality, and semantic uncertainty.</text>

  <text x="900" y="952" text-anchor="middle" class="caption">Figure: RISC-V-aware 3D proxy cost comparison across generic, connectivity-only, ASA-RV3D v2, and graph-context v3 assignments.</text>
</svg>
