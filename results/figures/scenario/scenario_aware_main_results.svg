<text x="635" y="594" text-anchor="middle" class="tick">State/clock protected</text>
<text x="465.0" y="670" text-anchor="middle" class="caption">All scenario-aware partitions reduce the scenario objective by roughly 69-79%.</text>
<rect x="870" y="155" width="760" height="540" class="panel"/>
