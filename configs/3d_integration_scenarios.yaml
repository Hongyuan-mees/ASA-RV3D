# Phase-3 scenario definitions for normalized dynamic ASA.
#
# This file records the scenario weights used by the final Phase-3 optimizer.
# The archived pre-Phase-3 exploratory scenario file is kept as:
#   configs/3d_integration_scenarios.legacy.yaml
#
# Interpretation:
#   These are scenario-specific risk proxies for constrained post-refinement on
#   native timing-aware TritonPart assignments. They are not physical signoff
#   constraints and should be interpreted together with area, cut, timing-path,
#   and canonical timing-crossing guards.

name: normalized_dynamic_phase3_scenarios
version: phase3_normalized_dynamic_v1

defaults:
  architecture_unit_weight: 1.0
  semantic_group_weight: 1.0

scenarios:
  control_datapath_split:
    description: >
      Control/datapath-oriented constrained refinement proxy. Instances in
      control or datapath semantic groups receive elevated architecture risk.
      This scenario does not force a literal floorplan separation; it evaluates
      whether architecture-sensitive control/datapath structures can be improved
      under TritonPart-compatible feasibility and timing-path guards.
    phase3_optimizer_weights:
      semantic_group_weights:
        control: 3.0
        datapath: 3.0
      architecture_unit_weights: {}
    structural_evaluation_targets:
      - generated_control
      - generated_datapath
      - execute_alu
      - control
      - datapath
    notes:
      - PicoRV32/control_datapath_split is retained as a diagnostic anomaly in current Phase-3 results.

  memory_near_logic:
    description: >
      Memory-related logic crossing-risk proxy. Register-file and load/store
      units receive the strongest architecture risk, ALU/multiply-divide logic
      receives moderate risk, and datapath-group instances receive secondary
      risk.
    phase3_optimizer_weights:
      semantic_group_weights:
        datapath: 2.0
      architecture_unit_weights:
        register_file: 7.0
        load_store: 7.0
        execute_alu: 3.0
        multdiv: 3.0
    structural_evaluation_targets:
      - register_file
      - load_store
      - lsu
      - memory
    notes:
      - Scenarios with no observable target structures should be marked N/A for architecture-semantics claims.

  state_and_clock_protected:
    description: >
      Conservative state/distribution protection proxy. Clock/reset and
      sequential-state units receive strong risk; CSR and trap/debug structures
      receive moderate risk; control and datapath groups receive smaller
      secondary risk.
    phase3_optimizer_weights:
      semantic_group_weights:
        control: 2.0
        datapath: 1.5
      architecture_unit_weights:
        clock_reset: 8.0
        pipeline_state: 6.0
        csr: 4.0
        trap_debug: 4.0
    structural_evaluation_targets:
      - clock_reset
      - pipeline_state
      - register_state
      - csr
      - trap_debug
